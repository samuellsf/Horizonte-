<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frota Horizonte - Mapa</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/mapa.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

<div class="container">

    <aside>

        <div class="logo-container">
            <img

            <h2 class="legenda-frota">

            </h2>
        </div>

        <div class="nav-buttons">
            <button onclick="window.location.href='dashboard.html'">

            </button>

            <button class="active" onclick="window.location.href='mapa.html'">

            </button>

            <button id="btn-exportar">

        </div>

    </aside>

    <main>
        <div id="mapa-container"></div>
    </main>

</div>

<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="map"></div>

<button class="btn-voltar-mobile" onclick="history.back()">
    ← Voltar
</button>

<script defer src="../js/api.js"></script>
<script defer src="../js/frota.js"></script>
<script defer src="../js/mapa.js"></script>
<script defer src="../js/auth.js"></script>
